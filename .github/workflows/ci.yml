name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The default token is read-write on a public repository; nothing here writes.
permissions:
  contents: read

# A superseded push stops burning runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # package.json declares node >=22.12; both ends of that get tested.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          # The Sätteri modified-time plugin reads `git log`. The default
          # shallow checkout would resolve every post to the same commit.
          # (Vercel clones at depth 2 and cannot be configured, which is why
          # frontmatter `updatedDate` is the source of truth — see
          # docs/ARCHITECTURE.md.)
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check spelling
        run: pnpm spell

      - name: Check architecture rules
        run: pnpm check:arch

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      # `pnpm build` would run `astro check` a second time; the step above
      # already did, and a failure there names itself more clearly.
      - name: Build
        run: pnpm build:fast

  lighthouse:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:fast

      - name: Lighthouse budget
        run: pnpm dlx @lhci/cli@0.15.1 autorun

      # Without this a failed budget prints a score and discards the report,
      # which is not enough to diagnose it from a pull request.
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 7
